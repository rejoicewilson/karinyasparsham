name: Financial workflow E2E

on:
  workflow_dispatch:

jobs:
  financial-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: e2e
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_ADMIN_LOGIN_ID: ${{ secrets.E2E_ADMIN_LOGIN_ID }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ALLOW_MUTATIONS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate E2E environment secrets
        shell: bash
        run: |
          test -n "$E2E_BASE_URL"
          test -n "$E2E_ADMIN_LOGIN_ID"
          test -n "$E2E_ADMIN_PASSWORD"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
